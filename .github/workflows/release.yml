name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build RimWorld 1.7 mod
        run: dotnet build RimRPC.slnx -c Release --warnaserror
      - name: Run xUnit tests
        run: dotnet test Tests/RimRPC.Tests.csproj -c Release --no-build
      - name: Verify package and translations
        run: python3 Tests/validate_package.py
      - name: Verify mod dependencies
        run: |
          test -f RimWorldRPC/1.7/Assemblies/RimRPC.dll
          test -f RimWorldRPC/1.7/Assemblies/DiscordRPC.dll
          test -f RimWorldRPC/1.7/Assemblies/Newtonsoft.Json.dll
          test ! -f RimWorldRPC/1.7/Assemblies/Assembly-CSharp.dll
          test ! -f RimWorldRPC/1.7/Assemblies/RimWorld.dll
      - name: Package mod
        run: zip -qq -r RWRichPresence.zip RimWorldRPC -x '*.DS_Store' '*.pdb'
      - name: Upload release archive
        run: gh release upload "$RELEASE_TAG" RWRichPresence.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
